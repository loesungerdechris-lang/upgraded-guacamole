[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-core"
version = "0.1.0"
description = "Deterministic evidence and policy verification core for SENTINEL."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Christian Meyer" }
]
license = { text = "Proprietary - internal development" }
dependencies = [
  "cryptography>=42.0.0",
  "jsonschema>=4.22.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0"
]
gemma4 = [
  "accelerate>=1.2.0",
  "fastapi>=0.115.0",
  "pillow>=11.0.0",
  "torch>=2.6.0",
  "transformers>=5.10.1",
  "uvicorn>=0.34.0"
]

[project.scripts]
sentinel-gemma4-api = "sentinel_core.gemma4_gateway:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Narrow compatibility waivers only; no security or verifier rule is disabled globally.
"src/sentinel_core/receipt.py" = ["UP017"]
"tests/test_receipt_verifier.py" = ["UP012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
