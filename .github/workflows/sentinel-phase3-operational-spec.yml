name: SENTINEL Phase 3 Operational Spec

on:
  pull_request:
    branches:
      - main
      - agent/memento-adapter-hold
    paths:
      - "docs/phase3-operational-orchestration-spec.md"
      - "docs/phase3-multi-source-historical-evidence-spec.md"
      - "docs/phase3-multi-source-threat-model.md"
      - "docs/memento-adapter-boundary.md"
      - "tests/test_phase3_operational_spec.py"
      - ".github/workflows/sentinel-phase3-operational-spec.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/phase3-operational-orchestration-spec.md"
      - "docs/phase3-multi-source-historical-evidence-spec.md"
      - "docs/phase3-multi-source-threat-model.md"
      - "docs/memento-adapter-boundary.md"
      - "tests/test_phase3_operational_spec.py"
      - ".github/workflows/sentinel-phase3-operational-spec.yml"

permissions:
  contents: read

jobs:
  phase3-operational-spec:
    name: phase3-operational-spec
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Guard operational HOLD boundary
        shell: bash
        run: |
          set -euo pipefail
          spec="docs/phase3-operational-orchestration-spec.md"

          grep -F '**Status:** DRAFT / HOLD' "$spec"
          grep -F '**Activation authority:** none' "$spec"
          grep -F 'Every run and every output remains `HOLD`.' "$spec"
          grep -F 'No run changes `HOLD` to `VERIFIED` or `PUBLISHED`.' "$spec"
          grep -F \
            'Memento is discovery provenance only and never acquires candidate content.' \
            "$spec"
          grep -F 'It has no adapter registry and no transport.' "$spec"
          grep -F 'global_concurrency: 1' "$spec"
          grep -F 'per_source_concurrency: 1' "$spec"
          grep -F 'publication: false' "$spec"

          forbidden='(automatic[[:space:]]+publication'
          forbidden+='|automatic[[:space:]]+all-source[[:space:]]+fan-out[[:space:]]+enabled'
          forbidden+='|active_content_execution:[[:space:]]+true'
          forbidden+='|archive_writes:[[:space:]]+true'
          forbidden+='|publication:[[:space:]]+true)'

          if grep -nEi "$forbidden" "$spec"; then
            echo "Operational Phase 3 boundary was widened." >&2
            exit 1
          fi

      - name: Compile governance tests
        run: python -m compileall -q tests/test_phase3_operational_spec.py

      - name: Lint governance tests
        run: ruff check tests/test_phase3_operational_spec.py

      - name: Test operational specification
        run: pytest -q tests/test_phase3_operational_spec.py
