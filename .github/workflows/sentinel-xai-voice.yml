name: SENTINEL xAI Voice Boundary

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'src/sentinel_core/xai_voice.py'
      - 'tests/test_xai_voice.py'
      - 'tests/test_xai_voice_review_regressions.py'
      - 'docs/xai-voice-agent-security-gate.md'
      - 'pyproject.toml'
      - '.github/workflows/sentinel-xai-voice.yml'
      - 'scripts/apply_xai_current_docs_hardening.py'
      - '.github/workflows/apply-xai-current-doc-hardening.yml'
  push:
    branches: ["main"]
    paths:
      - 'src/sentinel_core/xai_voice.py'
      - 'tests/test_xai_voice.py'
      - 'tests/test_xai_voice_review_regressions.py'
      - 'docs/xai-voice-agent-security-gate.md'
      - 'pyproject.toml'
      - '.github/workflows/sentinel-xai-voice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-current-doc-hardening:
    name: apply-current-doc-hardening
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feat/xai-voice-boundary'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/xai-voice-boundary
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Apply SHA-guarded hardening patch
        run: python scripts/apply_xai_current_docs_hardening.py

      - name: Enforce exact changed-file scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            '.github/workflows/sentinel-xai-voice.yml'
            'docs/xai-voice-agent-security-gate.md'
            'src/sentinel_core/xai_voice.py'
            'tests/test_xai_voice.py'
            'tests/test_xai_voice_review_regressions.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Install package with deterministic voice and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,voice]

      - name: Compile
        run: python -m compileall -q src tests

      - name: Lint
        run: ruff check src tests

      - name: Run focused xAI boundary tests
        run: |
          pytest -q \
            tests/test_xai_voice.py \
            tests/test_xai_voice_review_regressions.py

      - name: Commit verified hardening patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/sentinel-xai-voice.yml \
            docs/xai-voice-agent-security-gate.md \
            src/sentinel_core/xai_voice.py \
            tests/test_xai_voice.py \
            tests/test_xai_voice_review_regressions.py
          git commit -m 'fix: harden xAI resumption and current API compatibility'
          git push origin HEAD:feat/xai-voice-boundary

  xai-voice-boundary:
    name: xai-voice-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install package with voice and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,voice]

      - name: Guard credential and authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          source_file='src/sentinel_core/xai_voice.py'

          forbidden='(sk-[A-Za-z0-9]{16,}|xai-[A-Za-z0-9]{16,}|BEGIN .*PRIVATE KEY|shell[[:space:]]*=[[:space:]]*True)'
          if grep -niE "$forbidden" "$source_file"; then
            echo 'A credential literal, private key, or shell execution entered the voice boundary.' >&2
            exit 1
          fi

          if grep -nE 'agent_[A-Za-z0-9]{16,}' "$source_file"; then
            echo 'A concrete hosted agent identifier entered production source.' >&2
            exit 1
          fi

          grep -F '_XAI_REALTIME_ENDPOINT = "wss://api.x.ai/v1/realtime"' "$source_file"
          grep -F 'XAI_API_KEY' "$source_file"
          grep -F 'agent_id is undocumented' "$source_file"
          grep -F 'authoritative": False' "$source_file"
          grep -F 'turn delivery became ambiguous' "$source_file"
          grep -F 'compression=None' "$source_file"

      - name: Prove optional runtime dependency is available
        run: |
          python - <<'PY'
          import websockets
          from sentinel_core.xai_voice import VoiceSessionConfig

          assert websockets.__version__
          assert VoiceSessionConfig().websocket_url() == (
              'wss://api.x.ai/v1/realtime?model=grok-voice-latest'
          )
          PY

      - name: Compile
        run: python -m compileall -q src tests

      - name: Lint
        run: ruff check src tests

      - name: Run xAI voice boundary tests
        run: |
          pytest -q \
            tests/test_xai_voice.py \
            tests/test_xai_voice_review_regressions.py
