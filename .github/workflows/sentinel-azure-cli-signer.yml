name: SENTINEL Azure CLI Signer Adapter

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'src/sentinel_core/azure_cli_signing.py'
      - 'src/sentinel_core/external_signing.py'
      - 'src/sentinel_core/receipt.py'
      - 'tests/test_azure_cli_signing*.py'
      - 'docs/azure-cli-digest-signer-adapter.md'
      - '.github/workflows/sentinel-azure-cli-signer.yml'
  push:
    branches: ["main"]
    paths:
      - 'src/sentinel_core/azure_cli_signing.py'
      - 'src/sentinel_core/external_signing.py'
      - 'src/sentinel_core/receipt.py'
      - 'tests/test_azure_cli_signing*.py'
      - 'docs/azure-cli-digest-signer-adapter.md'
      - '.github/workflows/sentinel-azure-cli-signer.yml'

permissions:
  contents: read

jobs:
  azure-cli-signer-adapter:
    name: azure-cli-signer-adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Guard Azure CLI signer boundary
        shell: bash
        run: |
          set -euo pipefail
          source_file='src/sentinel_core/azure_cli_signing.py'

          forbidden='(AZURE_CLIENT_SECRET|ClientSecretCredential|DefaultAzureCredential|InteractiveBrowserCredential|generate_private_key|load_pem_private_key|load_der_private_key|private_bytes|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|shell[[:space:]]*=[[:space:]]*True)'
          if grep -nE "$forbidden" "$source_file"; then
            echo 'Credential acquisition, private-key custody or shell execution appeared in the Azure CLI signer adapter.' >&2
            exit 1
          fi

          grep -F 'shell=False' "$source_file"
          grep -F 'stdin=subprocess.DEVNULL' "$source_file"
          grep -F 'env=None' "$source_file"
          grep -F '"--only-show-errors"' "$source_file"
          grep -F '"--id"' "$source_file"
          grep -F 'validate_azure_key_id(request.key_id)' "$source_file"
          grep -F 'raise AzureCliSigningError("Azure CLI signing operation timed out") from None' "$source_file"

      - name: Prove adapter API remains credential-free
        shell: python
        run: |
          from dataclasses import fields
          from inspect import signature

          from sentinel_core.azure_cli_signing import AzureCliKeyVaultDigestSigner
          from sentinel_core.external_signing import DigestSigningRequest

          request_fields = [field.name for field in fields(DigestSigningRequest)]
          if request_fields != ['algorithm', 'key_id', 'digest_b64url']:
              raise SystemExit(f'Digest request boundary widened: {request_fields!r}')

          adapter_fields = [field.name for field in fields(AzureCliKeyVaultDigestSigner)]
          if adapter_fields != ['executable', 'timeout_seconds', 'runner']:
              raise SystemExit(f'Adapter configuration boundary widened: {adapter_fields!r}')

          parameters = list(signature(AzureCliKeyVaultDigestSigner.sign_digest).parameters)
          if parameters != ['self', 'request']:
              raise SystemExit(f'Signer method boundary widened: {parameters!r}')

      - name: Lint
        run: ruff check src tests

      - name: Run Azure CLI adapter and independent verifier tests
        run: |
          pytest -q tests/test_azure_cli_signing.py tests/test_azure_cli_signing_key_id.py
          pytest -q tests/test_external_signing.py tests/test_external_signing_unicode.py
          pytest -q tests/test_receipt_verifier.py tests/test_receipt_canonical_chain.py
