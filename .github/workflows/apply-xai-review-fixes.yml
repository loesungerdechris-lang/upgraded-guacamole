name: Apply xAI Review Fixes

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/apply_xai_review_fixes.py'
      - '.github/workflows/apply-xai-review-fixes.yml'

permissions:
  contents: read

concurrency:
  group: apply-xai-review-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event.pull_request.number == 26 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact PR branch without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feat/xai-voice-boundary
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify branch has not moved
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/feat/xai-voice-boundary" --jq '.object.sha')"
          test "$branch_head" = "$EXPECTED_HEAD"

      - name: Reconstruct reviewed pre-patch source locally
        shell: bash
        run: |
          set -euo pipefail
          git show 7bda85673da5ae04f92f8036e672b300075206ce:src/sentinel_core/xai_voice.py \
            > src/sentinel_core/xai_voice.py

      - name: Harden patch replacement semantics
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/apply_xai_review_fixes.py')
          text = path.read_text(encoding='utf-8')
          old = "        replacement,\n        text,\n"
          new = "        lambda _match: replacement,\n        text,\n"
          if text.count(old) != 1:
              raise SystemExit('unexpected replace_one implementation')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Regenerate exact source and missing tests
        run: python scripts/apply_xai_review_fixes.py

      - name: Restore one-time patch source
        run: git checkout -- scripts/apply_xai_review_fixes.py

      - name: Prove regenerated source matches published source
        run: git diff --exit-code -- src/sentinel_core/xai_voice.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,voice]'

      - name: Compile
        run: python -m compileall -q src tests

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Validate remaining patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = 'tests/test_xai_voice.py'

      - name: Upload verified missing test file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xai-review-tests-${{ github.event.pull_request.head.sha }}
          path: tests/test_xai_voice.py
          if-no-files-found: error
          retention-days: 1
