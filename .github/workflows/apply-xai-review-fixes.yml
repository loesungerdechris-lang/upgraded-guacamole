name: Apply xAI Review Fixes

on:
  push:
    branches: ["feat/xai-voice-boundary"]
    paths:
      - 'scripts/apply_xai_review_fixes.py'
      - '.github/workflows/apply-xai-review-fixes.yml'

permissions:
  contents: write

concurrency:
  group: apply-xai-review-fixes
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feat/xai-voice-boundary
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Apply exact-blob guarded patch
        run: python scripts/apply_xai_review_fixes.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,voice]'

      - name: Compile
        run: python -m compileall -q src tests

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Validate patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'src/sentinel_core/xai_voice.py\ntests/test_xai_voice.py'

      - name: Remove one-time repair machinery
        run: |
          rm scripts/apply_xai_review_fixes.py
          rm .github/workflows/apply-xai-review-fixes.yml

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close xAI voice review gaps'
          git push origin HEAD:feat/xai-voice-boundary
