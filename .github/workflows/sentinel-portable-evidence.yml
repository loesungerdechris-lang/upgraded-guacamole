name: SENTINEL Portable Evidence CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: sentinel-portable-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint portable evidence implementation
        run: ruff check src/sentinel_core/portable_evidence.py tests/test_portable_evidence.py

      - name: Run portable evidence tests
        run: pytest -q tests/test_portable_evidence.py

      - name: Guard production source against private key custody
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n -E 'generate_private_key|load_pem_private_key|private_key\(|"d"\s*:' src/sentinel_core/portable_evidence.py
