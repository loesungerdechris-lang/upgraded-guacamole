name: SENTINEL Receipt Verifier Gate

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  receipt-verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Guard against private signing material
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(find . -type f \
            \( -name '*.pem' \
              -o -name '*.key' \
              -o -name '*.pfx' \
              -o -name '*.p12' \
              -o -name '*.private.jwk' \
              -o -name '.env' \) \
            -not -path './.git/*' || true)
          if [ -n "$forbidden" ]; then
            echo "Forbidden secret-like files found:"
            echo "$forbidden"
            exit 1
          fi

      - name: Guard against frontend/demo key generation claims
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "crypto\.subtle\.generateKey\|privateKey\|BEGIN .*PRIVATE KEY" \
            src tests docs .github --exclude-dir=.git; then
            echo "Forbidden signer/private-key pattern found in repository-verifier surface."
            exit 1
          fi

      - name: Lint
        run: ruff check src tests

      - name: Run receipt verifier red-team tests
        run: pytest -q tests/test_receipt_verifier.py
