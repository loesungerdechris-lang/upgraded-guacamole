name: SENTINEL Temporary Ruff Diagnostic

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ruff-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Emit exact Ruff diagnostics for immutable PR head
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.clone_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init -q repo
          cd repo
          git remote add origin "$HEAD_REPO"
          git fetch -q --depth 1 origin "$HEAD_SHA"
          git checkout -q --detach FETCH_HEAD
          python3 -m pip install -q --disable-pip-version-check ruff==0.16.0
          ruff check src tests --output-format=concise
