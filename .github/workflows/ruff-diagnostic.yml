name: SENTINEL Temporary Ruff Diagnostic

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ruff-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout immutable PR source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package with developer tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Emit exact Ruff diagnostics
        run: ruff check src tests --output-format=concise
