name: SENTINEL Wayback Evidence

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/sentinel_core/wayback.py"
      - "src/sentinel_core/wayback_manifest.py"
      - "tests/test_wayback.py"
      - "tests/test_wayback_manifest.py"
      - "schemas/sentinel.wayback.evidence.v1.json"
      - "config/wayback-source-policy.json"
      - "docs/wayback-evidence-layer.md"
      - "docs/wayback-evidence-policy.md"
      - "docs/wayback-policy-schema-consistency.md"
      - "docs/phase3-multi-source-historical-evidence-spec.md"
      - "docs/wayback-release-receipt-gate.md"
      - "docs/wayback-release-verifier-implementation-checklist.md"
      - ".github/workflows/sentinel-wayback-evidence.yml"
  push:
    branches: ["main"]
    paths:
      - "src/sentinel_core/wayback.py"
      - "src/sentinel_core/wayback_manifest.py"
      - "tests/test_wayback.py"
      - "tests/test_wayback_manifest.py"
      - "schemas/sentinel.wayback.evidence.v1.json"
      - "config/wayback-source-policy.json"
      - "docs/wayback-evidence-layer.md"
      - "docs/wayback-evidence-policy.md"
      - "docs/wayback-policy-schema-consistency.md"
      - "docs/phase3-multi-source-historical-evidence-spec.md"
      - "docs/wayback-release-receipt-gate.md"
      - "docs/wayback-release-verifier-implementation-checklist.md"
      - ".github/workflows/sentinel-wayback-evidence.yml"

permissions:
  contents: read

jobs:
  wayback-evidence:
    name: wayback-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Guard archive trust boundary
        shell: bash
        run: |
          set -euo pipefail
          source_file="src/sentinel_core/wayback.py"
          validator_file="src/sentinel_core/wayback_manifest.py"
          policy_file="config/wayback-source-policy.json"

          grep -F 'https://archive.org/wayback/available' "$source_file"
          grep -F 'https://web.archive.org/cdx/search/cdx' "$source_file"
          grep -F 'https://web.archive.org' "$source_file"
          grep -F '"automatic_save_page_now": false' "$policy_file"
          grep -F '"publish_restored_content": false' "$policy_file"
          grep -F 'VERIFIED manifests require explicit release-aware validation' "$validator_file"
          grep -F 'PUBLISHED manifests require the separate manual release-receipt gate' "$validator_file"

          forbidden='(waybackrebuilder|waybackdownloader|waybackdownloads|shell[[:space:]]*=[[:space:]]*True|execute_script|selenium|playwright)'
          if grep -nEi "$forbidden" "$source_file" "$validator_file" "$policy_file"; then
            echo "Archive boundary widened to an untrusted or executable path." >&2
            exit 1
          fi

      - name: Validate policy and manifest schema JSON
        run: |
          python -m json.tool config/wayback-source-policy.json >/dev/null
          python -m json.tool schemas/sentinel.wayback.evidence.v1.json >/dev/null

      - name: Compile
        run: python -m compileall -q src tests

      - name: Lint
        run: ruff check src tests

      - name: Test Wayback evidence layer
        run: pytest -q tests/test_wayback.py tests/test_wayback_manifest.py
