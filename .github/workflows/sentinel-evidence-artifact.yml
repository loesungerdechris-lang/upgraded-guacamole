name: SENTINEL Evidence Artifact

on:
  pull_request:
    branches:
      - main
      - agent/phase3-pilot-threat-model-hold
    paths:
      - "docs/sentinel-evidence-artifact-spec.md"
      - "docs/sentinel-evidence-artifact-path-rules.md"
      - "schemas/sentinel.evidence.artifact.v1.json"
      - "src/sentinel_core/evidence_artifact.py"
      - "tests/test_evidence_artifact.py"
      - "tests/test_evidence_artifact_review_regressions.py"
      - ".github/workflows/sentinel-evidence-artifact.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/sentinel-evidence-artifact-spec.md"
      - "docs/sentinel-evidence-artifact-path-rules.md"
      - "schemas/sentinel.evidence.artifact.v1.json"
      - "src/sentinel_core/evidence_artifact.py"
      - "tests/test_evidence_artifact.py"
      - "tests/test_evidence_artifact_review_regressions.py"
      - ".github/workflows/sentinel-evidence-artifact.yml"

permissions:
  contents: read

jobs:
  evidence-artifact:
    name: evidence-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Guard verifier-only HOLD boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = {
              "spec": Path("docs/sentinel-evidence-artifact-spec.md").read_text(
                  encoding="utf-8"
              ),
              "path_spec": Path(
                  "docs/sentinel-evidence-artifact-path-rules.md"
              ).read_text(encoding="utf-8"),
              "schema": Path(
                  "schemas/sentinel.evidence.artifact.v1.json"
              ).read_text(encoding="utf-8"),
              "module": Path("src/sentinel_core/evidence_artifact.py").read_text(
                  encoding="utf-8"
              ),
          }

          required = {
              "spec": [
                  "**Status:** DRAFT / HOLD",
                  "**Activation authority:** none",
                  "**Signing authority:** none",
                  "**Publication authority:** none",
              ],
              "path_spec": [
                  "**Status:** DRAFT / HOLD",
                  "**Activation authority:** none",
                  "**Publication authority:** none",
                  "The verifier never repairs, normalizes, rewrites",
                  "contain no colon",
                  "Alternate Data Stream",
              ],
              "schema": [
                  '"status": {"const": "HOLD"}',
                  "(?!.*:)",
                  "(?!.*//)",
                  r"(?!.*[\u0000-\u001F\u007F])",
              ],
              "module": [
                  "release_authorized: bool = False",
                  "temporal_anchor_verified: bool = False",
                  '"publication": False',
                  "Non-canonical evidence bundle path",
                  "already-bound filesystem object",
                  "Stable filesystem object identity is unavailable; BYTES is blocked",
                  'if ":" in value',
              ],
          }

          missing = []
          for file_name, tokens in required.items():
              for token in tokens:
                  if token not in files[file_name]:
                      missing.append(f"{file_name}: {token}")
          if missing:
              raise SystemExit(
                  "Evidence artifact HOLD guard missing required tokens:\n- "
                  + "\n- ".join(missing)
              )

          forbidden = re.compile(
              r"(^|\s)(requests|httpx|aiohttp|socket|subprocess)[\s.]"
              r"|private_key|generate_private_key|sign\("
              r"|publish\(|Save Page Now|pull_request_target",
              re.IGNORECASE | re.MULTILINE,
          )
          match = forbidden.search(files["module"])
          if match:
              raise SystemExit(
                  "Evidence artifact verifier boundary was widened: "
                  + match.group(0)
              )
          PY

      - name: Validate schema JSON
        run: python -m json.tool schemas/sentinel.evidence.artifact.v1.json >/dev/null

      - name: Compile
        run: |
          python -m compileall -q \
            src/sentinel_core/evidence_artifact.py \
            tests/test_evidence_artifact.py \
            tests/test_evidence_artifact_review_regressions.py

      - name: Lint
        run: |
          ruff check \
            src/sentinel_core/evidence_artifact.py \
            tests/test_evidence_artifact.py \
            tests/test_evidence_artifact_review_regressions.py

      - name: Test evidence artifact
        run: |
          pytest -q \
            tests/test_evidence_artifact.py \
            tests/test_evidence_artifact_review_regressions.py \
            --junitxml=evidence-artifact-junit.xml

      - name: Upload non-sensitive test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-artifact-test-report
          path: evidence-artifact-junit.xml
          if-no-files-found: error
          retention-days: 1
