name: SENTINEL Evidence Artifact

on:
  pull_request:
    branches:
      - main
      - agent/phase3-pilot-threat-model-hold
    paths:
      - "docs/sentinel-evidence-artifact-spec.md"
      - "schemas/sentinel.evidence.artifact.v1.json"
      - "src/sentinel_core/evidence_artifact.py"
      - "tests/test_evidence_artifact.py"
      - ".github/workflows/sentinel-evidence-artifact.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/sentinel-evidence-artifact-spec.md"
      - "schemas/sentinel.evidence.artifact.v1.json"
      - "src/sentinel_core/evidence_artifact.py"
      - "tests/test_evidence_artifact.py"
      - ".github/workflows/sentinel-evidence-artifact.yml"

permissions:
  contents: read

jobs:
  evidence-artifact:
    name: evidence-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Guard verifier-only HOLD boundary
        shell: bash
        run: |
          set -euo pipefail
          spec="docs/sentinel-evidence-artifact-spec.md"
          schema="schemas/sentinel.evidence.artifact.v1.json"
          module="src/sentinel_core/evidence_artifact.py"

          grep -F '**Status:** DRAFT / HOLD' "$spec"
          grep -F '**Activation authority:** none' "$spec"
          grep -F '**Signing authority:** none' "$spec"
          grep -F '**Publication authority:** none' "$spec"
          grep -F '"status": {"const": "HOLD"}' "$schema"
          grep -F 'release_authorized: bool = False' "$module"
          grep -F 'temporal_anchor_verified: bool = False' "$module"
          grep -F '"publication": False' "$module"

          forbidden='(^|[[:space:]])(requests|httpx|aiohttp|socket|subprocess)[[:space:].]'
          forbidden+='|private_key|generate_private_key|sign\('
          forbidden+='|publish\(|Save Page Now|pull_request_target'

          if grep -nEi "$forbidden" "$module"; then
            echo "Evidence artifact verifier boundary was widened." >&2
            exit 1
          fi

      - name: Validate schema JSON
        run: python -m json.tool schemas/sentinel.evidence.artifact.v1.json >/dev/null

      - name: Compile
        run: python -m compileall -q src/sentinel_core/evidence_artifact.py tests/test_evidence_artifact.py

      - name: Lint
        run: ruff check src/sentinel_core/evidence_artifact.py tests/test_evidence_artifact.py

      - name: Test evidence artifact
        run: pytest -q tests/test_evidence_artifact.py --junitxml=evidence-artifact-junit.xml

      - name: Upload non-sensitive test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-artifact-test-report
          path: evidence-artifact-junit.xml
          if-no-files-found: error
          retention-days: 1
