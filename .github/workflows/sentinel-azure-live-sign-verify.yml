name: SENTINEL Azure Live Sign Verify

on:
  workflow_dispatch:
    inputs:
      confirm_authorized_execution:
        description: Confirm authorized tenant, protected environment, and deliberate live signing
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: sentinel-azure-live-sign-production
  cancel-in-progress: false

jobs:
  live-sign-verify:
    if: github.ref == 'refs/heads/main' && inputs.confirm_authorized_execution == true
    runs-on: ubuntu-latest
    environment: sentinel-production
    timeout-minutes: 15
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SENTINEL_KEY_VAULT_NAME: ${{ vars.SENTINEL_KEY_VAULT_NAME }}
      SENTINEL_KEY_NAME: ${{ vars.SENTINEL_KEY_NAME }}
      SENTINEL_KEY_NOT_BEFORE: ${{ vars.SENTINEL_KEY_NOT_BEFORE }}
      SENTINEL_KEY_NOT_AFTER: ${{ vars.SENTINEL_KEY_NOT_AFTER }}
      SENTINEL_LIVE_SIGNING_ENABLED: ${{ vars.SENTINEL_LIVE_SIGNING_ENABLED }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate protected environment configuration
        shell: python
        run: |
          import os
          import re
          from datetime import datetime

          required = (
              'AZURE_CLIENT_ID',
              'AZURE_TENANT_ID',
              'AZURE_SUBSCRIPTION_ID',
              'SENTINEL_KEY_VAULT_NAME',
              'SENTINEL_KEY_NAME',
              'SENTINEL_KEY_NOT_BEFORE',
              'SENTINEL_KEY_NOT_AFTER',
              'SENTINEL_LIVE_SIGNING_ENABLED',
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing protected environment values: ' + ', '.join(missing))

          if os.environ['SENTINEL_LIVE_SIGNING_ENABLED'] != 'AUTHORIZED-BY-DEPLOYMENT-REVIEW':
              raise SystemExit('Protected live signing activation value is not approved')

          guid = re.compile(
              r'^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-'
              r'[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          )
          for name in ('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID'):
              if guid.fullmatch(os.environ[name]) is None:
                  raise SystemExit(f'{name} is not a valid GUID')

          if re.fullmatch(r'[a-z0-9](?:[a-z0-9-]{1,22}[a-z0-9])?', os.environ['SENTINEL_KEY_VAULT_NAME']) is None:
              raise SystemExit('SENTINEL_KEY_VAULT_NAME is invalid')
          if re.fullmatch(r'[A-Za-z0-9-]{1,127}', os.environ['SENTINEL_KEY_NAME']) is None:
              raise SystemExit('SENTINEL_KEY_NAME is invalid')

          timestamps = []
          for name in ('SENTINEL_KEY_NOT_BEFORE', 'SENTINEL_KEY_NOT_AFTER'):
              value = os.environ[name]
              if not value.endswith('Z'):
                  raise SystemExit(f'{name} must be RFC3339 UTC')
              try:
                  timestamps.append(datetime.fromisoformat(value[:-1] + '+00:00'))
              except ValueError as exc:
                  raise SystemExit(f'{name} must be RFC3339 UTC') from exc
          if timestamps[0] >= timestamps[1]:
              raise SystemExit('SENTINEL key validity interval is empty or reversed')

      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify federated tenant and subscription
        shell: bash
        run: |
          set -euo pipefail
          actual_tenant="$(az account show --only-show-errors --query tenantId --output tsv)"
          actual_subscription="$(az account show --only-show-errors --query id --output tsv)"

          test "$actual_tenant" = "$AZURE_TENANT_ID"
          test "$actual_subscription" = "$AZURE_SUBSCRIPTION_ID"
          echo 'Federated tenant and subscription binding verified.'

      - name: Fetch public versioned key metadata
        shell: bash
        run: |
          set -euo pipefail
          az keyvault key show \
            --only-show-errors \
            --vault-name "$SENTINEL_KEY_VAULT_NAME" \
            --name "$SENTINEL_KEY_NAME" \
            --query 'key.{kid:kid,kty:kty,crv:crv,key_ops:keyOps,x:x,y:y}' \
            --output json > public-key-metadata.json

          test -s public-key-metadata.json
          test "$(wc -c < public-key-metadata.json)" -le 131072

      - name: Freeze public receipt timestamp
        id: receipt-context
        shell: python
        run: |
          import os
          from datetime import datetime, timezone

          created_at = datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00', 'Z')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'created_at={created_at}\n')

      - name: Sign digest and independently verify receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/azure/build-live-signing-evidence.py \
            --key-metadata public-key-metadata.json \
            --output-dir sentinel-live-evidence \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --created-at "${{ steps.receipt-context.outputs.created_at }}" \
            --not-before "$SENTINEL_KEY_NOT_BEFORE" \
            --not-after "$SENTINEL_KEY_NOT_AFTER"

      - name: Validate public evidence file set and content
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            evidence-manifest.json \
            public-trust-entry.json \
            signed-receipt.json \
            subject-manifest.json \
            verification-report.json)
          actual=$(find sentinel-live-evidence -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$actual" = "$expected"

          test "$(jq -r '.status' sentinel-live-evidence/verification-report.json)" = 'RC_VERIFIED'
          test "$(jq -r '.verified' sentinel-live-evidence/verification-report.json)" = 'true'
          test "$(jq -r '.verification_status' sentinel-live-evidence/evidence-manifest.json)" = 'RC_VERIFIED'

          forbidden='(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AZURE_CLIENT_SECRET|client[_-]?secret|access[_-]?token|refresh[_-]?token|Bearer[[:space:]]|"d"[[:space:]]*:)'
          if grep -RInE "$forbidden" sentinel-live-evidence; then
            echo 'Forbidden credential or private-key material found in public evidence.' >&2
            exit 1
          fi

      - name: Write verification summary
        shell: bash
        run: |
          set -euo pipefail
          receipt_hash="$(jq -r '.receipt_hash' sentinel-live-evidence/verification-report.json)"
          {
            echo '## SENTINEL protected live sign and verify'
            echo
            echo '- Explicit authorized dispatch: confirmed'
            echo '- Protected live-signing activation: confirmed'
            echo '- GitHub OIDC authentication: passed'
            echo '- Azure tenant/subscription binding: passed'
            echo '- Key Vault digest signing: passed'
            echo '- Independent receipt verification: RC_VERIFIED'
            echo "- Receipt hash: $receipt_hash"
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_RUN_ID / attempt $GITHUB_RUN_ATTEMPT"
            echo
            echo 'Artifact contains public evidence only.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload public evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sentinel-live-sign-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: sentinel-live-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          overwrite: false
          include-hidden-files: false

      - name: Remove transient signing files
        if: always()
        shell: bash
        run: rm -rf public-key-metadata.json sentinel-live-evidence

      - name: Azure logout
        if: always()
        shell: bash
        run: az logout --only-show-errors || true
