name: SENTINEL Live Evidence CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'src/sentinel_core/live_evidence.py'
      - 'src/sentinel_core/azure_cli_signing.py'
      - 'src/sentinel_core/external_signing.py'
      - 'src/sentinel_core/receipt.py'
      - 'scripts/azure/build-live-signing-evidence.py'
      - 'tests/test_live_evidence*.py'
      - 'docs/live-sign-verify-evidence.md'
      - '.github/workflows/sentinel-azure-live-sign-verify.yml'
      - '.github/workflows/sentinel-live-evidence-ci.yml'
  push:
    branches: ["main"]
    paths:
      - 'src/sentinel_core/live_evidence.py'
      - 'src/sentinel_core/azure_cli_signing.py'
      - 'src/sentinel_core/external_signing.py'
      - 'src/sentinel_core/receipt.py'
      - 'scripts/azure/build-live-signing-evidence.py'
      - 'tests/test_live_evidence*.py'
      - 'docs/live-sign-verify-evidence.md'
      - '.github/workflows/sentinel-azure-live-sign-verify.yml'
      - '.github/workflows/sentinel-live-evidence-ci.yml'

permissions:
  contents: read

jobs:
  live-evidence:
    name: live-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Guard production evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          sources=(
            src/sentinel_core/live_evidence.py
            scripts/azure/build-live-signing-evidence.py
          )

          forbidden='(AZURE_CLIENT_SECRET|ClientSecretCredential|DefaultAzureCredential|InteractiveBrowserCredential|generate_private_key|load_pem_private_key|load_der_private_key|private_bytes|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|client[_-]?secret[[:space:]]*[:=])'
          if grep -nE "$forbidden" "${sources[@]}"; then
            echo 'Credential acquisition or private-key custody appeared in production evidence code.' >&2
            exit 1
          fi

          workflow='.github/workflows/sentinel-azure-live-sign-verify.yml'
          workflow_forbidden='(secrets\.|client-secret:|creds:|AZURE_CLIENT_SECRET:[[:space:]]*\$\{\{|azure/login[^@]*@[^0-9a-f])'
          if grep -nE "$workflow_forbidden" "$workflow"; then
            echo 'A credential-backed or mutable live workflow path was detected.' >&2
            exit 1
          fi

          grep -F 'workflow_dispatch:' "$workflow"
          grep -F 'confirm_authorized_execution:' "$workflow"
          grep -F 'default: false' "$workflow"
          grep -F "if: github.ref == 'refs/heads/main' && inputs.confirm_authorized_execution == true" "$workflow"
          grep -F 'environment: sentinel-production' "$workflow"
          grep -F 'SENTINEL_LIVE_SIGNING_ENABLED:' "$workflow"
          grep -F 'vars.SENTINEL_LIVE_SIGNING_ENABLED' "$workflow"
          grep -F 'AUTHORIZED-BY-DEPLOYMENT-REVIEW' "$workflow"
          grep -F 'id-token: write' "$workflow"
          grep -F 'persist-credentials: false' "$workflow"
          grep -F 'azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5' "$workflow"
          grep -F 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' "$workflow"
          grep -F 'if-no-files-found: error' "$workflow"
          grep -F 'overwrite: false' "$workflow"
          grep -F 'include-hidden-files: false' "$workflow"

      - name: Prove public evidence API shape
        shell: python
        run: |
          from dataclasses import fields

          from sentinel_core.live_evidence import (
              LiveEvidenceContext,
              PublicKeyMetadata,
              PublicTrustPolicy,
          )

          expected = {
              PublicKeyMetadata: ['kid', 'kty', 'crv', 'key_ops', 'x', 'y'],
              LiveEvidenceContext: [
                  'repository',
                  'commit_sha',
                  'workflow',
                  'run_id',
                  'run_attempt',
                  'created_at',
              ],
              PublicTrustPolicy: ['role', 'status', 'not_before', 'not_after'],
          }
          for model, names in expected.items():
              actual = [field.name for field in fields(model)]
              if actual != names:
                  raise SystemExit(f'{model.__name__} boundary widened: {actual!r}')

      - name: Validate CLI entry point
        run: python scripts/azure/build-live-signing-evidence.py --help > /dev/null

      - name: Lint
        run: ruff check src tests scripts

      - name: Run live evidence and independent verifier tests
        run: |
          pytest -q tests/test_live_evidence.py
          pytest -q tests/test_azure_cli_signing.py tests/test_azure_cli_signing_key_id.py
          pytest -q tests/test_external_signing.py tests/test_external_signing_unicode.py
          pytest -q tests/test_receipt_verifier.py tests/test_receipt_canonical_chain.py
