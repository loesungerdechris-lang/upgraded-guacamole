name: SENTINEL Temporary Ruff Diagnostic

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-diagnostic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Emit exact Ruff diagnostics
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$HEAD_REF" \
            "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 -m pip install -q --disable-pip-version-check -e '.[dev]'
          ruff --version
          ruff check src tests --output-format=concise
