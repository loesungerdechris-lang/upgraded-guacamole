name: SENTINEL Memento Adapter

on:
  pull_request:
    branches:
      - main
      - agent/wayback-evidence-layer
    paths:
      - "src/sentinel_core/memento.py"
      - "tests/test_memento.py"
      - "config/memento-source-policy.json"
      - "docs/memento-adapter-boundary.md"
      - "docs/phase3-multi-source-historical-evidence-spec.md"
      - "docs/phase3-multi-source-threat-model.md"
      - ".github/workflows/sentinel-memento-adapter.yml"
  push:
    branches: ["main"]
    paths:
      - "src/sentinel_core/memento.py"
      - "tests/test_memento.py"
      - "config/memento-source-policy.json"
      - "docs/memento-adapter-boundary.md"
      - "docs/phase3-multi-source-historical-evidence-spec.md"
      - "docs/phase3-multi-source-threat-model.md"
      - ".github/workflows/sentinel-memento-adapter.yml"

permissions:
  contents: read

jobs:
  memento-adapter:
    name: memento-adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Guard Memento HOLD boundary
        shell: bash
        run: |
          set -euo pipefail
          source_file="src/sentinel_core/memento.py"
          policy_file="config/memento-source-policy.json"

          grep -F 'enabled: bool = False' "$source_file"
          grep -F 'Memento redirects are disabled' "$source_file"
          grep -F 'artifact_acquired: bool = False' "$source_file"
          grep -F 'SEPARATE_POLICY_REQUIRED = "separate_policy_required"' "$source_file"
          grep -F 'HOLD_STATUS = "HOLD"' "$source_file"
          grep -F 'method="GET"' "$source_file"

          grep -F '"enabled": false' "$policy_file"
          grep -F '"follow_redirects": false' "$policy_file"
          grep -F '"memento_content_acquisition": false' "$policy_file"
          grep -F '"automatic_status_elevation": false' "$policy_file"
          grep -F '"publication": false' "$policy_file"

          forbidden='(selenium|playwright|execute_script|requests[.]post|urlopen[[:space:]]*\(|shell[[:space:]]*=[[:space:]]*True)'
          if grep -nEi "$forbidden" "$source_file"; then
            echo "Memento adapter widened to an executable or side-effecting path." >&2
            exit 1
          fi

      - name: Validate source policy JSON
        run: python -m json.tool config/memento-source-policy.json >/dev/null

      - name: Compile
        run: python -m compileall -q src tests

      - name: Lint focused files
        run: ruff check src/sentinel_core/memento.py tests/test_memento.py

      - name: Test Memento adapter
        run: pytest -q tests/test_memento.py
