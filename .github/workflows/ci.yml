name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate immutable workflow action pins
        shell: python
        run: |
          from __future__ import annotations

          import re
          from pathlib import Path

          workflow_paths = sorted(Path('.github/workflows').glob('*.y*ml'))
          uses_pattern = re.compile(r'^\s*(?:-\s*)?uses:\s*([^\s#]+)')
          immutable_remote = re.compile(r'^[^@\s]+@[0-9a-fA-F]{40}$')
          checkout_action = re.compile(r'^actions/checkout@[0-9a-fA-F]{40}$')
          failures: list[str] = []

          for path in workflow_paths:
              lines = path.read_text(encoding='utf-8').splitlines()
              for index, line in enumerate(lines):
                  match = uses_pattern.match(line)
                  if match is None:
                      continue

                  action = match.group(1)
                  if action.startswith('./'):
                      continue
                  if immutable_remote.fullmatch(action) is None:
                      failures.append(
                          f'{path}:{index + 1}: remote action is not pinned to a 40-hex commit: {action}'
                      )
                      continue

                  if checkout_action.fullmatch(action) is None:
                      continue

                  indent = len(line) - len(line.lstrip())
                  step_tail: list[str] = []
                  for candidate in lines[index + 1:]:
                      stripped = candidate.lstrip()
                      candidate_indent = len(candidate) - len(stripped)
                      if stripped.startswith('- ') and candidate_indent <= indent:
                          break
                      step_tail.append(candidate)

                  if not any(
                      re.match(r'^\s*persist-credentials:\s*false\s*(?:#.*)?$', candidate)
                      for candidate in step_tail
                  ):
                      failures.append(
                          f'{path}:{index + 1}: checkout must set persist-credentials: false'
                      )

          if failures:
              raise SystemExit('\n'.join(failures))

          print(f'validated immutable pins and checkout credential handling in {len(workflow_paths)} workflows')

      - name: Check for forbidden secret-like files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(find . -type f \
            \( -name '*.pem' -o -name '*.key' -o -name '*.pfx' -o -name '*.p12' -o -name '.env' \) \
            -not -path './.git/*' || true)
          if [ -n "$forbidden" ]; then
            echo "Forbidden secret-like files found:"
            echo "$forbidden"
            exit 1
          fi

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('.').rglob('*.json'):
              if '.git' in path.parts:
                  continue
              with path.open('r', encoding='utf-8') as handle:
                  json.load(handle)
              print(f'valid json: {path}')
          PY

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q
