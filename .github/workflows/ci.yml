name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate immutable workflow action pins
        run: PYTHONPATH=src python -m sentinel_core.workflow_security .github/workflows

      - name: Check for forbidden secret-like files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(find . -type f \
            \( -name '*.pem' -o -name '*.key' -o -name '*.pfx' -o -name '*.p12' -o -name '.env' \) \
            -not -path './.git/*' || true)
          if [ -n "$forbidden" ]; then
            echo "Forbidden secret-like files found:"
            echo "$forbidden"
            exit 1
          fi

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('.').rglob('*.json'):
              if '.git' in path.parts:
                  continue
              with path.open('r', encoding='utf-8') as handle:
                  json.load(handle)
              print(f'valid json: {path}')
          PY

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

  integrity-required-ci:
    name: SENTINEL Required CI
    if: ${{ always() }}
    needs: [repository-hygiene, python-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every mandatory job to have succeeded
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          expected = {"repository-hygiene", "python-tests"}
          jobs = json.loads(os.environ["JOB_RESULTS"])
          passed = (
              set(jobs) == expected
              and all(jobs[name].get("result") == "success" for name in expected)
          )
          if not passed:
              print("Mandatory CI did not complete successfully.")
              sys.exit(1)
          print("All mandatory CI jobs completed successfully.")
          PY
