name: SENTINEL Phase 3 Pilot Activation

on:
  pull_request:
    branches:
      - main
      - agent/phase3-operational-spec-hold
    paths:
      - "docs/phase3-pilot-activation-framework.md"
      - "docs/phase3-operational-orchestration-spec.md"
      - "docs/phase3-multi-source-threat-model.md"
      - "docs/memento-adapter-boundary.md"
      - "tests/test_phase3_pilot_activation_framework.py"
      - ".github/workflows/sentinel-phase3-pilot-activation.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/phase3-pilot-activation-framework.md"
      - "docs/phase3-operational-orchestration-spec.md"
      - "docs/phase3-multi-source-threat-model.md"
      - "docs/memento-adapter-boundary.md"
      - "tests/test_phase3_pilot_activation_framework.py"
      - ".github/workflows/sentinel-phase3-pilot-activation.yml"

permissions:
  contents: read

jobs:
  phase3-pilot-activation:
    name: phase3-pilot-activation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Guard pilot HOLD boundary
        shell: bash
        run: |
          set -euo pipefail
          framework="docs/phase3-pilot-activation-framework.md"

          grep -F '**Status:** DRAFT / HOLD' "$framework"
          grep -F '**Activation authority:** none' "$framework"
          grep -F 'Issue #30 is not a prerequisite for a strictly internal HOLD-only pilot.' "$framework"
          grep -F 'There is no transition to `VERIFIED` or `PUBLISHED`.' "$framework"
          grep -F 'Memento remains discovery-only and never acquires candidate content.' "$framework"
          grep -F 'manual_trigger_only: true' "$framework"
          grep -F 'global_concurrency: 1' "$framework"
          grep -F 'per_source_concurrency: 1' "$framework"
          grep -F 'active_content_execution: false' "$framework"
          grep -F 'live_fallback: false' "$framework"
          grep -F 'archive_writes: false' "$framework"
          grep -F 'publication: false' "$framework"
          grep -F 'Raw data is not automatically deleted on abort.' "$framework"
          grep -F 'An Actions artifact is not the authoritative evidence store.' "$framework"

          forbidden='(publication:[[:space:]]+true'
          forbidden+='|archive_writes:[[:space:]]+true'
          forbidden+='|active_content_execution:[[:space:]]+true'
          forbidden+='|manual_trigger_only:[[:space:]]+false'
          forbidden+='|recursive_memento_traversal:[[:space:]]+true'
          forbidden+='|Memento adapter itself retrieves archived content)'

          if grep -nEi "$forbidden" "$framework"; then
            echo "Phase 3 pilot boundary was widened." >&2
            exit 1
          fi

      - name: Compile governance tests
        run: python -m compileall -q tests/test_phase3_pilot_activation_framework.py

      - name: Lint governance tests
        run: ruff check tests/test_phase3_pilot_activation_framework.py

      - name: Test pilot activation framework
        run: pytest -q tests/test_phase3_pilot_activation_framework.py
