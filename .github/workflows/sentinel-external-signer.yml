name: SENTINEL External Signer Contract

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'src/sentinel_core/external_signing.py'
      - 'src/sentinel_core/receipt.py'
      - 'src/sentinel_core/hashchain.py'
      - 'tests/test_external_signing*.py'
      - 'docs/external-digest-signer-contract.md'
      - '.github/workflows/sentinel-external-signer.yml'
  push:
    branches: ["main"]
    paths:
      - 'src/sentinel_core/external_signing.py'
      - 'src/sentinel_core/receipt.py'
      - 'src/sentinel_core/hashchain.py'
      - 'tests/test_external_signing*.py'
      - 'docs/external-digest-signer-contract.md'
      - '.github/workflows/sentinel-external-signer.yml'

permissions:
  contents: read

jobs:
  external-signer-contract:
    name: external-signer-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Guard production signer boundary
        shell: bash
        run: |
          set -euo pipefail
          source_file='src/sentinel_core/external_signing.py'

          forbidden='(generate_private_key|load_pem_private_key|load_der_private_key|private_bytes|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AZURE_CLIENT_SECRET|ClientSecretCredential|DefaultAzureCredential)'
          if grep -nE "$forbidden" "$source_file"; then
            echo 'Private-key custody or credential acquisition appeared in the production signer contract.' >&2
            exit 1
          fi

          if grep -nE '(verified[[:space:]]*=|"verified"[[:space:]]*:)' "$source_file"; then
            echo 'The signer contract must not declare its own output verified.' >&2
            exit 1
          fi

      - name: Prove narrow external request shape
        shell: python
        run: |
          from dataclasses import fields
          from sentinel_core.external_signing import DigestSigningRequest

          actual = [field.name for field in fields(DigestSigningRequest)]
          expected = ['algorithm', 'key_id', 'digest_b64url']
          if actual != expected:
              raise SystemExit(f'External request widened: {actual!r}')

      - name: Lint
        run: ruff check src tests

      - name: Run signer and independent verifier tests
        run: |
          pytest -q tests/test_external_signing.py tests/test_external_signing_unicode.py
          pytest -q tests/test_receipt_verifier.py tests/test_receipt_canonical_chain.py
