name: Apply xAI Open Review Fixes

on:
  push:
    branches: ["feat/xai-voice-boundary"]
    paths:
      - 'scripts/apply_xai_open_review_fixes.py'
      - 'scripts/finalize_xai_open_review_fixes.py'
      - '.github/workflows/apply-xai-open-review-fixes.yml'

permissions:
  contents: write

concurrency:
  group: apply-xai-open-review-fixes
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.repository == 'loesungerdechris-lang/upgraded-guacamole'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feat/xai-voice-boundary
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify branch head has not moved
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Apply SHA-guarded security patches
        run: |
          python scripts/apply_xai_open_review_fixes.py
          python scripts/finalize_xai_open_review_fixes.py

      - name: Enforce exact changed-file scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "src/sentinel_core/xai_voice.py"
          test "${changed[1]}" = "tests/test_xai_voice.py"
          test "${changed[2]}" = "tests/test_xai_voice_review_regressions.py"

      - name: Install package with voice and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,voice]

      - name: Compile
        run: python -m compileall -q src tests

      - name: Lint
        run: ruff check src tests

      - name: Run focused xAI boundary tests
        run: |
          pytest -q \
            tests/test_xai_voice.py \
            tests/test_xai_voice_review_regressions.py

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sentinel-review-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/sentinel_core/xai_voice.py \
            tests/test_xai_voice.py \
            tests/test_xai_voice_review_regressions.py
          git commit -m "Fix programmatic voice boundary and text deltas"
          git push origin HEAD:feat/xai-voice-boundary
