name: SENTINEL Phase 3 Pilot Threat Model

on:
  pull_request:
    branches:
      - main
      - agent/phase3-pilot-activation-hold
    paths:
      - "docs/phase3-pilot-threat-model-addendum.md"
      - "docs/phase3-pilot-activation-framework.md"
      - "docs/phase3-multi-source-threat-model.md"
      - "docs/phase3-operational-orchestration-spec.md"
      - "tests/test_phase3_pilot_threat_model_addendum.py"
      - ".github/workflows/sentinel-phase3-pilot-threat-model.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/phase3-pilot-threat-model-addendum.md"
      - "docs/phase3-pilot-activation-framework.md"
      - "docs/phase3-multi-source-threat-model.md"
      - "docs/phase3-operational-orchestration-spec.md"
      - "tests/test_phase3_pilot_threat_model_addendum.py"
      - ".github/workflows/sentinel-phase3-pilot-threat-model.yml"

permissions:
  contents: read

jobs:
  phase3-pilot-threat-model:
    name: phase3-pilot-threat-model
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Guard pilot threat HOLD boundary
        shell: bash
        run: |
          set -euo pipefail
          addendum="docs/phase3-pilot-threat-model-addendum.md"

          grep -F '**Status:** DRAFT / HOLD' "$addendum"
          grep -F '**Activation authority:** none' "$addendum"
          grep -F 'Issue #30 remains the separate publication dependency.' "$addendum"
          grep -F 'Memento remains discovery-only' "$addendum"
          grep -F 'no candidate-content acquisition' "$addendum"
          grep -F 'no `pull_request_target` execution of untrusted code' "$addendum"
          grep -F 'use exact commit SHA, not a mutable branch name' "$addendum"
          grep -F 'raw sensitive evidence prohibited from Actions artifacts by default' "$addendum"
          grep -F 'no automatic deletion merely because a run aborted' "$addendum"
          grep -F 'There is no transition to `VERIFIED` or `PUBLISHED`.' \
            docs/phase3-pilot-activation-framework.md

          forbidden='(activation authority:[[:space:]]+granted'
          forbidden+='|automatic[[:space:]]+pilot[[:space:]]+approval'
          forbidden+='|Memento[[:space:]]+content[[:space:]]+acquisition[[:space:]]+enabled'
          forbidden+='|pull_request_target:[[:space:]]*$'
          forbidden+='|archive_writes:[[:space:]]+true'
          forbidden+='|publication:[[:space:]]+true'
          forbidden+='|automatic[[:space:]]+deletion[[:space:]]+on[[:space:]]+abort)'

          if grep -nEi "$forbidden" "$addendum"; then
            echo "Pilot threat boundary was widened." >&2
            exit 1
          fi

      - name: Compile governance tests
        run: python -m compileall -q tests/test_phase3_pilot_threat_model_addendum.py

      - name: Lint governance tests
        run: ruff check tests/test_phase3_pilot_threat_model_addendum.py

      - name: Test pilot threat model addendum
        run: pytest -q tests/test_phase3_pilot_threat_model_addendum.py
